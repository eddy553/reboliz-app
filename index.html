<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reboliz - Red Social y Mercado Global</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Leaflet CSS & JS for Open Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        reboliz: {
                            50: '#e6f9ed',
                            100: '#c2f2d5',
                            500: '#00c853',
                            600: '#00a844',
                            700: '#008735',
                            900: '#005722'
                        },
                        fb: {
                            bg: '#f0f2f5',
                            card: '#ffffff',
                            blue: '#1877f2',
                            hover: '#e4e6eb'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-wheel {
            animation: spin-slow 8s linear infinite;
        }
    </style>
</head>
<body class="bg-fb-bg dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-full flex flex-col overflow-hidden select-none">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- ================= VISTA 1: FORMULARIO DE REGISTRO (SIN WHATSAPP) ================= -->
    <div id="vista-registro" class="fixed inset-0 bg-slate-900/90 z-50 flex flex-col items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-2xl max-w-md w-full border-t-4 border-reboliz-500 space-y-4">
            <div class="text-center space-y-2">
                <div class="w-14 h-14 bg-reboliz-50 dark:bg-reboliz-900/50 rounded-full mx-auto flex items-center justify-center shadow-inner">
                    <i class="fa-solid fa-bicycle text-reboliz-500 text-2xl animate-spin-wheel"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-900 dark:text-white" data-i18n="reg_title">Comunidad Reboliz</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400" data-i18n="reg_desc">Regístrate para acceder al muro, mercado y chat interno.</p>
            </div>

            <form id="registroForm" onsubmit="procesarRegistro(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-700 dark:text-slate-300" data-i18n="reg_name">Nombre de Usuario o Apodo</label>
                    <input type="text" id="reg-nombre" placeholder="Ej. Eddy" required class="w-full bg-slate-100 dark:bg-slate-700 text-xs py-2.5 px-3 rounded-xl border-0 focus:ring-2 focus:ring-reboliz-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-700 dark:text-slate-300" data-i18n="reg_email">Correo electrónico (Gmail)</label>
                    <input type="email" id="reg-email" placeholder="tucorreo@gmail.com" required class="w-full bg-slate-100 dark:bg-slate-700 text-xs py-2.5 px-3 rounded-xl border-0 focus:ring-2 focus:ring-reboliz-500">
                </div>
                <button type="submit" class="w-full bg-reboliz-500 hover:bg-reboliz-600 text-white font-bold text-xs py-3 rounded-xl shadow transition mt-2" data-i18n="reg_btn">
                    Registrarme y Entrar
                </button>
                <p class="text-[10px] text-slate-500 text-center leading-relaxed" data-i18n="reg_note">
                    🔒 Tu Gmail protege tu perfil dentro de la aplicación.
                </p>
            </form>
        </div>
    </div>

    <!-- ================= VISTA 2: APLICACIÓN PRINCIPAL ================= -->
    <div id="vista-app" class="hidden flex-1 flex flex-col h-full overflow-hidden">
        <!-- Top Navigation Bar -->
        <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 h-14 flex items-center justify-between px-4 shrink-0 z-40 shadow-sm">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 rounded-full bg-reboliz-50 dark:bg-reboliz-900/40 flex items-center justify-center shadow-inner">
                    <i class="fa-solid fa-gear text-reboliz-500 text-xl animate-spin-wheel"></i>
                </div>
                <span class="font-bold text-xl tracking-tight text-slate-900 dark:text-white">Reboliz</span>
            </div>
            <div class="flex items-center space-x-3">
                <!-- Selector de Idiomas -->
                <select id="lang-selector" onchange="changeLanguage(this.value)" class="bg-slate-100 dark:bg-slate-700 text-xs font-semibold py-1.5 px-2 rounded-lg border-0 focus:ring-2 focus:ring-reboliz-500 cursor-pointer text-slate-800 dark:text-slate-100">
                    <option value="es">🇪🇸 ES</option>
                    <option value="pt">🇧🇷 PT</option>
                    <option value="en">🇺🇸 EN</option>
                    <option value="fr">🇫🇷 FR</option>
                    <option value="zh">🇨🇳 ZH</option>
                </select>
                <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300">
                    <i id="theme-icon" class="fa-solid fa-moon text-sm"></i>
                </button>
            </div>
        </header>

        <!-- Main Container Body -->
        <main class="flex-1 overflow-y-auto relative no-scrollbar pb-16">
            <!-- TAB 1: FEED -->
            <div id="tab-feed" class="tab-content active max-w-xl mx-auto p-3 space-y-4">
                <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm p-4 border border-slate-100 dark:border-slate-700">
                    <div class="flex items-center space-x-3 mb-3">
                        <img src="https://placehold.co/100x100/00c853/ffffff?text=ME" alt="Avatar" class="w-10 h-10 rounded-full object-cover border-2 border-reboliz-500">
                        <input type="text" id="post-input-text" data-i18n-placeholder="what_is_on_your_mind" placeholder="¿Qué estás pensando, emprendedor?" class="w-full bg-slate-100 dark:bg-slate-700 text-sm py-2.5 px-4 rounded-full border-0 focus:outline-none focus:ring-2 focus:ring-reboliz-500 text-slate-800 dark:text-slate-100">
                    </div>
                    <div class="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-700">
                        <button onclick="createNewPost()" class="bg-reboliz-500 hover:bg-reboliz-600 text-white font-bold text-xs px-4 py-2 rounded-xl shadow transition" data-i18n="publish">
                            Publicar
                        </button>
                    </div>
                </div>
                <div id="posts-container" class="space-y-4"></div>
            </div>

            <!-- TAB 2: MARKETPLACE & MAP -->
            <div id="tab-market" class="tab-content max-w-xl mx-auto p-3 space-y-4">
                <div class="bg-white dark:bg-slate-800 p-3 rounded-2xl shadow-sm space-y-3">
                    <div class="flex items-center space-x-2">
                        <input type="text" id="market-search" oninput="filterClassifieds()" data-i18n-placeholder="search_classifieds" placeholder="Buscar en Río Grande do Sul..." class="w-full bg-slate-100 dark:bg-slate-700 text-xs py-2.5 px-3 rounded-xl border-0 text-slate-800 dark:text-slate-100 flex-1">
                        <button onclick="toggleMapView()" class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 px-3 py-2.5 rounded-xl text-xs font-bold flex items-center space-x-1">
                            <i class="fa-solid fa-map-location-dot text-reboliz-500"></i>
                            <span id="map-toggle-text" data-i18n="map_view">Mapa</span>
                        </button>
                    </div>
                    <!-- Map Container -->
                    <div id="map-wrapper" class="hidden h-56 rounded-xl overflow-hidden border border-slate-200 dark:border-slate-700 relative z-10">
                        <div id="leaflet-map" class="w-full h-full"></div>
                    </div>
                </div>
                <div id="classifieds-grid" class="grid grid-cols-2 gap-3"></div>
            </div>

            <!-- TAB 3: CHAT -->
            <div id="tab-chat" class="tab-content max-w-xl mx-auto h-[calc(100vh-8rem)] flex flex-col bg-white dark:bg-slate-800 shadow-sm rounded-2xl overflow-hidden m-0 sm:m-3">
                <div class="p-3 border-b border-slate-200 dark:border-slate-700 font-bold text-sm" data-i18n="tab_chat">Chat Encriptado</div>
                <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50/50 dark:bg-slate-900/50"></div>
                <div class="p-3 border-t border-slate-200 dark:border-slate-700 flex items-center space-x-2">
                    <input type="text" id="chat-input-msg" onkeydown="if(event.key==='Enter')sendChatMessage()" data-i18n-placeholder="type_message" placeholder="Escribe un mensaje..." class="flex-1 bg-slate-100 dark:bg-slate-700 text-xs py-2.5 px-4 rounded-full border-0 text-slate-800 dark:text-slate-100">
                    <button onclick="sendChatMessage()" class="bg-reboliz-500 text-white w-10 h-10 rounded-full flex items-center justify-center"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>

            <!-- TAB 4: FINANZAS -->
            <div id="tab-finance" class="tab-content max-w-xl mx-auto p-3 space-y-4">
                <div class="bg-gradient-to-br from-slate-900 to-slate-800 text-white rounded-2xl p-5 shadow-lg space-y-3">
                    <h3 class="text-sm font-bold text-slate-300" data-i18n="financial_panel">Panel Financiero & Pasarela de Pagos</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-white/10 p-3 rounded-xl"><span class="text-[10px] block" data-i18n="admob_earnings">Ganancias AdMob</span><h4 class="text-lg font-bold text-emerald-400">$1,482.50 USD</h4></div>
                        <div class="bg-white/10 p-3 rounded-xl"><span class="text-[10px] block" data-i18n="merchant_fees">PIX / Comercios</span><h4 class="text-lg font-bold text-cyan-400">R$ 3,840.00</h4></div>
                    </div>
                    <button onclick="payBoost()" class="w-full bg-reboliz-500 hover:bg-reboliz-600 text-white text-xs font-bold py-2.5 rounded-xl shadow transition" data-i18n="pay_pix_card">
                        Pagar con Mercado Pago / PIX
                    </button>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 h-16 flex items-center justify-around px-2 shrink-0 z-40 fixed bottom-0 left-0 right-0 max-w-xl mx-auto">
            <button onclick="switchTab('feed')" id="nav-btn-feed" class="flex flex-col items-center justify-center flex-1 py-1 text-reboliz-500"><i class="fa-solid fa-house text-lg"></i><span class="text-[10px]" data-i18n="tab_feed">Feed</span></button>
            <button onclick="switchTab('market')" id="nav-btn-market" class="flex flex-col items-center justify-center flex-1 py-1 text-slate-400"><i class="fa-solid fa-store text-lg"></i><span class="text-[10px]" data-i18n="tab_market">Mercado</span></button>
            <button onclick="switchTab('chat')" id="nav-btn-chat" class="flex flex-col items-center justify-center flex-1 py-1 text-slate-400"><i class="fa-solid fa-comments text-lg"></i><span class="text-[10px]" data-i18n="tab_chat">Chat</span></button>
            <button onclick="switchTab('finance')" id="nav-btn-finance" class="flex flex-col items-center justify-center flex-1 py-1 text-slate-400"><i class="fa-solid fa-chart-pie text-lg"></i><span class="text-[10px]" data-i18n="tab_finance">Finanzas</span></button>
        </nav>
    </div>

    <!-- JavaScript -->
    <script>
        const translations = {
            es: {
                reg_title: "Comunidad Reboliz",
                reg_desc: "Regístrate para acceder al muro, mercado y chat interno.",
                reg_name: "Nombre de Usuario o Apodo",
                reg_email: "Correo electrónico (Gmail)",
                reg_btn: "Registrarme y Entrar",
                reg_note: "🔒 Tu Gmail protege tu perfil dentro de la aplicación.",
                what_is_on_your_mind: "¿Qué estás pensando, emprendedor?",
                publish: "Publicar",
                search_classifieds: "Buscar en Río Grande do Sul...",
                map_view: "Mapa",
                tab_feed: "Feed",
                tab_market: "Mercado",
                tab_chat: "Chat",
                tab_finance: "Finanzas",
                financial_panel: "Panel Financiero & Pasarela",
                admob_earnings: "Ganancias AdMob",
                merchant_fees: "PIX / Comercios",
                pay_pix_card: "Pagar con Mercado Pago / PIX",
                welcome_msg: "¡Bienvenido a Reboliz!"
            },
            pt: {
                reg_title: "Comunidade Reboliz",
                reg_desc: "Cadastre-se para acessar o feed, mercado e chat interno.",
                reg_name: "Nome de Usuário ou Apelido",
                reg_email: "E-mail (Gmail)",
                reg_btn: "Cadastrar e Entrar",
                reg_note: "🔒 Seu Gmail protege seu perfil dentro do aplicativo.",
                what_is_on_your_mind: "No que você está pensando, empreendedor?",
                publish: "Publicar",
                search_classifieds: "Pesquisar no Rio Grande do Sul...",
                map_view: "Mapa",
                tab_feed: "Feed",
                tab_market: "Mercado",
                tab_chat: "Chat",
                tab_finance: "Finanças",
                financial_panel: "Painel Financeiro & Gateway",
                admob_earnings: "Ganhos AdMob",
                merchant_fees: "PIX / Comércios",
                pay_pix_card: "Pagar com Mercado Pago / PIX",
                welcome_msg: "Bem-vindo ao Reboliz!"
            },
            en: {
                reg_title: "Reboliz Community",
                reg_desc: "Sign up to access the feed, market, and internal chat.",
                reg_name: "Username or Nickname",
                reg_email: "Email (Gmail)",
                reg_btn: "Sign Up & Enter",
                reg_note: "🔒 Your Gmail protects your profile inside the app.",
                what_is_on_your_mind: "What's on your mind, entrepreneur?",
                publish: "Post",
                search_classifieds: "Search Rio Grande do Sul...",
                map_view: "Map",
                tab_feed: "Feed",
                tab_market: "Market",
                tab_chat: "Chat",
                tab_finance: "Finance",
                financial_panel: "Financial Dashboard & Gateway",
                admob_earnings: "AdMob Earnings",
                merchant_fees: "PIX / Merchants",
                pay_pix_card: "Pay with Mercado Pago / PIX",
                welcome_msg: "Welcome to Reboliz!"
            },
            fr: {
                reg_title: "Communauté Reboliz",
                reg_desc: "Inscrivez-vous pour accéder au fil d'actualité, au marché et au chat interne.",
                reg_name: "Nom d'utilisateur ou Surnom",
                reg_email: "E-mail (Gmail)",
                reg_phone: "Numéro de téléphone (WhatsApp)",
                reg_btn: "S'inscrire et Entrer",
                reg_note: "🔒 Votre Gmail protège votre profil dans l'application.",
                what_is_on_your_mind: "Qu'avez-vous en tête, entrepreneur ?",
                publish: "Publier",
                search_classifieds: "Rechercher au Rio Grande do Sul...",
                map_view: "Carte",
                tab_feed: "Fil",
                tab_market: "Marché",
                tab_chat: "Chat",
                tab_finance: "Finance",
                financial_panel: "Tableau de Bord Financier",

                welcome_msg: "Bienvenue sur Reboliz !"
            },
            zh: {
                reg_title: "Reboliz 社区",
                reg_desc: "注册以访问动态、市场和内部聊天。",
                reg_name: "用户名或昵称",
                reg_email: "电子邮箱 (Gmail)",
                reg_btn: "注册并进入",
                reg_note: "🔒 您的 Gmail 可保护您在应用内的个人资料。",
                what_is_on_your_mind: "创业者，你在想什么？",
                publish: "发布",
                search_classifieds: "在南里奥格兰德州搜索...",
                map_view: "地图",
                tab_feed: "动态",
                tab_market: "市场",
                tab_chat: "聊天",
                tab_finance: "财务",
                financial_panel: "财务面板与网关",
                admob_earnings: "AdMob 收益",
                merchant_fees: "PIX / 商家",
                pay_pix_card: "使用 Mercado Pago / PIX 支付",
                welcome_msg: "欢迎来到 Reboliz！"
            }
        };

        function changeLanguage(lang) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if(translations[lang] && translations[lang][key]) {
                    el.placeholder = translations[lang][key];
                }
            });
        }

        function procesarRegistro(event) {
            event.preventDefault();
            const nombre = document.getElementById('reg-nombre').value;
            const email = document.getElementById('reg-email').value;

            if(!nombre || !email) return;

            document.getElementById('vista-registro').classList.add('hidden');
            document.getElementById('vista-app').classList.remove('hidden');

            showToast(`¡Bienvenido a Reboliz, ${nombre}!`);
            renderPosts();
            renderClassifieds();
            renderChat();
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `bg-slate-900 text-white text-xs px-4 py-3 rounded-xl shadow-xl border-l-4 border-reboliz-500`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');

            if(tabId === 'market' && !mapInitialized) {
                initLeafletMap();
            }
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        /* ================= MAP LOGIC ================= */
        let mapInitialized = false;
        let leafletMap = null;
        const classifieds = [
            { title: "Consultoría PyME & PIX", region: "Porto Alegre", price: "R$ 150.00", lat: -30.0346, lng: -51.2177 },
            { title: "Cabaña Turística en Gramado", region: "Gramado", price: "R$ 350.00/n", lat: -29.3731, lng: -50.8760 }
        ];

        function initLeafletMap() {
            leafletMap = L.map('leaflet-map').setView([-30.0346, -51.2177], 7);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(leafletMap);

            classifieds.forEach(c => {
                L.marker([c.lat, c.lng]).addTo(leafletMap).bindPopup(`<b>${c.title}</b><br>${c.price}`);
            });
            mapInitialized = true;
        }

        function toggleMapView() {
            const wrapper = document.getElementById('map-wrapper');
            const toggleText = document.getElementById('map-toggle-text');
            wrapper.classList.toggle('hidden');
            if(!wrapper.classList.contains('hidden')) {
                toggleText.textContent = "Ocultar Mapa";
                if(!mapInitialized) initLeafletMap();
                else leafletMap.invalidateSize();
            } else {
                toggleText.textContent = "Mapa";
            }
        }

        function renderPosts() {
            document.getElementById('posts-container').innerHTML = `
                <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm space-y-2">
                    <h4 class="font-bold text-sm">Carlos Silva</h4>
                    <p class="text-xs">¡Café colonial abierto en Porto Alegre!</p>
                </div>
            `;
        }

        function renderClassifieds() {
            document.getElementById('classifieds-grid').innerHTML = classifieds.map(c => `
                <div class="bg-white dark:bg-slate-800 p-3 rounded-2xl shadow-sm space-y-1">
                    <span class="text-[9px] bg-emerald-50 text-emerald-600 font-bold px-2 py-0.5 rounded-full">${c.region}</span>
                    <h4 class="font-bold text-xs">${c.title}</h4>
                    <span class="font-extrabold text-sm text-emerald-600">${c.price}</span>
                </div>
            `).join('');
        }

        let chatMessages = [{ sender: 'other', text: '¡Hola! ¿Disponible asesoría PIX en el chat seguro?' }];
        function renderChat() {
            document.getElementById('chat-messages').innerHTML = chatMessages.map(m => `
                <div class="flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}">
                    <div class="bg-white dark:bg-slate-700 text-xs p-3 rounded-2xl shadow-sm">${m.text}</div>
                </div>
            `).join('');
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input-msg');
            if(!input.value.trim()) return;
            chatMessages.push({ sender: 'user', text: input.value });
            input.value = '';
            renderChat();
        }

        async function payBoost() {
            try {
                const response = await fetch('/api/crear-pago', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ plan: "Plan Municipal", precio: 9.90, usuario: "Emprendedor" })
                });
                const data = await response.json();
                if (data.init_point) window.location.href = data.init_point;
            } catch (error) {
                showToast("Error conectando al servidor de pagos.");
            }
        }
    </script>
</body>
</html>
